name: "opsscript-gate"
description: "A lightweight, non-privileged containerized pre-release verification tool for shell scripts."

inputs:
  script-path:
    description: "Path to the shell script to test."
    required: true
  matrix:
    description: "Comma-separated list of images."
    required: false
    default: "debian:12-slim,ubuntu:22.04,ubuntu:24.04,alpine:3.20"
  timeout:
    description: "Timeout in seconds per container."
    required: false
    default: "60"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      shell: bash
      run: |
        # We need to install the package from the action's directory
        pip install "${{ github.action_path }}"

    - name: Run opsscript-gate
      shell: bash
      run: |
        opsscript-gate "${{ inputs.script-path }}" \
          --matrix "${{ inputs.matrix }}" \
          --timeout "${{ inputs.timeout }}" \
          --format table
