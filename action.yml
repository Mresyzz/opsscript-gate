name: 'OpsScript Gate'
description: 'Run Linux shell scripts across Debian, Ubuntu and Alpine before release to catch runtime compatibility failures'
author: 'Mresyzz'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  script-path:
    description: 'Path to the target shell script to test (auto-discovers repository scripts if omitted)'
    required: false
    default: ''
  matrix:
    description: 'Comma-separated container images to test (e.g. debian:12-slim,ubuntu:22.04,ubuntu:24.04,alpine:3.20)'
    required: false
    default: ''
  jobs:
    description: 'Number of parallel container execution jobs (default: min(2, matrix_size))'
    required: false
    default: ''
  timeout:
    description: 'Hard timeout in seconds per container (default: 60)'
    required: false
    default: ''
  format:
    description: 'Output report format: table, markdown, or json'
    required: false
    default: ''
  shell:
    description: "Shell execution mode: 'posix' (default), 'shebang', or 'auto'"
    required: false
    default: ''
  mem-limit:
    description: 'Memory limit for containers (default: 256m)'
    required: false
    default: ''
  pids-limit:
    description: 'Maximum number of processes per container (default: 128)'
    required: false
    default: ''
  network:
    description: "Container network mode: 'bridge' or 'none' (default: bridge)"
    required: false
    default: ''

  config:
    description: 'Path to project JSON configuration'
    required: false
    default: ''
  preset:
    description: 'Distribution preset: minimal or ubuntu'
    required: false
    default: ''
  exclude:
    description: 'Newline-separated repository-relative exclusion globs'
    required: false
    default: ''
  max-scripts:
    description: 'Maximum discovered scripts; exceeding the limit fails'
    required: false
    default: ''
  dry-run:
    description: 'Preview the execution plan without Docker'
    required: false
    default: 'false'
  output:
    description: 'Save a report file for upload-artifact or other tooling'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install opsscript-gate
      shell: bash
      run: |
        pip install "${{ github.action_path }}"

    - name: Run compatibility gate
      shell: bash
      env:
        INPUT_SCRIPT_PATH: ${{ inputs.script-path }}
        INPUT_MATRIX: ${{ inputs.matrix }}
        INPUT_JOBS: ${{ inputs.jobs }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_SHELL: ${{ inputs.shell }}
        INPUT_MEM_LIMIT: ${{ inputs.mem-limit }}
        INPUT_PIDS_LIMIT: ${{ inputs.pids-limit }}
        INPUT_NETWORK: ${{ inputs.network }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_MAX_SCRIPTS: ${{ inputs.max-scripts }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        ARGS=("run")
        if [ -n "$INPUT_SCRIPT_PATH" ]; then
          ARGS+=("$INPUT_SCRIPT_PATH")
        fi
        # Only explicit inputs override project configuration.
        for pair in TIMEOUT FORMAT SHELL MEM_LIMIT PIDS_LIMIT NETWORK MATRIX JOBS CONFIG PRESET MAX_SCRIPTS OUTPUT; do
          var="INPUT_$pair"
          value="${!var}"
          if [ -n "$value" ]; then
            flag="${pair,,}"
            ARGS+=("--${flag//_/-}" "$value")
          fi
        done
        while IFS= read -r pattern; do
          pattern="${pattern%$'\r'}"
          [ -z "$pattern" ] || ARGS+=("--exclude" "$pattern")
        done <<< "$INPUT_EXCLUDE"
        if [ "$INPUT_DRY_RUN" = "true" ]; then
          ARGS+=("--dry-run")
        elif [ "$INPUT_DRY_RUN" != "false" ]; then
          echo "dry-run must be true or false" >&2
          exit 1
        fi
        python -m opsscript_gate.cli "${ARGS[@]}"
