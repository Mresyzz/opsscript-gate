name: Test opsscript-gate

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Pytest
        run: |
          pytest -v -m "not integration"

  integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Verify Docker Available
        run: docker version

      - name: Run Docker Integration Tests
        run: |
          pytest -v -m integration

      - name: Exercise the local composite Action
        uses: ./
        with:
          script-path: tests/fixtures/pass_basic.sh
          preset: minimal
          network: none
          output: action-report.json
          format: json
