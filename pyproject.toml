[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsscript-gate"
version = "0.8.3"
description = "Cross-distro shell testing and runtime compatibility checker for Debian, Ubuntu and Alpine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mresyzz" }
]
keywords = [
    "shell",
    "linux",
    "devops",
    "ci",
    "github-actions",
    "docker",
    "compatibility",
    "cross-distro",
    "posix",
    "testing",
    "installer",
    "bootstrap",
    "debian",
    "ubuntu",
    "alpine",
    "shellcheck-alternative",
    "shellcheck",
    "shell-portability",
    "installer-testing",
    "busybox",
    "command-not-found",
    "shell-script-testing",
    "runtime-compatibility",
    "portable-shell",
    "apt-get",
    "apk",
    "bashisms",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "docker>=7.0.0",
]

[project.urls]
Homepage = "https://mresyzz.github.io/opsscript-gate/"
Demo = "https://mresyzz.github.io/opsscript-gate/"
Repository = "https://github.com/Mresyzz/opsscript-gate"
Issues = "https://github.com/Mresyzz/opsscript-gate/issues"
Changelog = "https://github.com/Mresyzz/opsscript-gate/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Mresyzz/opsscript-gate/tree/main/docs"
Troubleshooting = "https://github.com/Mresyzz/opsscript-gate/blob/main/docs/command-not-found.md"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
opsscript-gate = "opsscript_gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opsscript_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: Integration tests requiring a running Docker daemon",
]
